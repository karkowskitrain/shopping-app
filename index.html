<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopping</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ---------- small inline icons (no external icon package needed) ----------
const Icon = ({ children, size = 16, color = "currentColor" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></Icon>;
const ShoppingBasket = (p) => <Icon {...p}><path d="M4 10h16l-1.5 9.5a2 2 0 0 1-2 1.5H7.5a2 2 0 0 1-2-1.5L4 10z" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></Icon>;
const Copy = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></Icon>;

// ---------- Store layout ----------
const AISLES = [
  { id: "produce", label: "Fruit & Veg", num: 1 },
  { id: "bakery", label: "Bakery", num: 2 },
  { id: "meat", label: "Meat, Fish & Deli", num: 3 },
  { id: "dairy", label: "Dairy & Eggs", num: 4 },
  { id: "frozen", label: "Frozen", num: 5 },
  { id: "pantry", label: "Pantry", num: 6 },
  { id: "drinks", label: "Drinks", num: 7 },
  { id: "household", label: "Household & Personal", num: 8 },
];

const CATEGORY_TABS = [
  { id: "produce", label: "Fruit" },
  { id: "veg", label: "Vegetables" },
  { id: "fish", label: "Fish" },
  { id: "chicken", label: "Chicken" },
  { id: "meat", label: "Meat" },
  { id: "pantry", label: "Ingredients" },
  { id: "dairy", label: "Dairy" },
  { id: "bakery", label: "Bakery" },
  { id: "frozen", label: "Frozen" },
  { id: "drinks", label: "Drinks" },
  { id: "household", label: "Household" },
];

const KEYWORD_MAP = [
  [["banana", "apple", "orange", "grape", "mandarin", "avocado", "lemon", "lime", "berries", "strawberr", "mango", "pear", "kiwi", "melon", "pineapple", "fruit"], "produce", "fruit"],
  [["carrot", "potato", "onion", "tomato", "lettuce", "broccoli", "capsicum", "cucumber", "pumpkin", "mushroom", "zucchini", "spinach", "garlic", "ginger", "salad", "herbs", "coriander", "parsley", "fresh bean"], "produce", "veg"],
  [["bread", "roll", "bun", "bagel", "croissant", "sourdough", "muffin", "wrap", "pita", "tortilla"], "bakery", "bakery"],
  [["chicken", "drumstick", "thigh", "wing", "schnitzel"], "meat", "chicken"],
  [["salmon", "fish", "tuna", "prawn", "seafood", "barramundi", "cod"], "meat", "fish"],
  [["beef", "mince", "steak", "lamb", "pork", "bacon", "sausage", "ham", "salami", "deli", "chikli con carne", "chilli con carne", "con carne"], "meat", "meat"],
  [["milk", "cheese", "yoghurt", "yogurt", "butter", "cream", "egg"], "dairy", "dairy"],
  [["frozen", "ice cream", "peas", "chips", "pizza", "greens for freezer", "cauliflour", "cauliflower"], "frozen", "frozen"],
  [["pasta", "rice", "flour", "sugar", "oil", "sauce", "can", "tin", "cereal", "oats", "spice", "salt", "pepper", "stock", "lentil", "bean", "vinegar", "honey", "jam", "peanut butter", "noodle", "curry paste", "curry", "mayonnaise", "mayo", "worcester", "muesli", "biscuit", "shortbread", "digestive", "kidney bean", "black bean", "baked bean"], "pantry", "pantry"],
  [["water", "juice", "soft drink", "coke", "soda", "coffee", "tea", "beer", "wine", "cordial"], "drinks", "drinks"],
  [["toilet paper", "paper towel", "detergent", "shampoo", "soap", "toothpaste", "cleaner", "tissue", "deodorant", "nappies", "dish", "steradent", "denture"], "household", "household"],
];

function classify(rawText) {
  const text = rawText.toLowerCase();
  for (const [keywords, aisleId, tabId] of KEYWORD_MAP) {
    if (keywords.some((k) => text.includes(k))) return { aisleId, tabId };
  }
  return { aisleId: "pantry", tabId: "pantry" };
}

function titleCase(s) {
  return s.replace(/\s+/g, " ").trim().replace(/^\w/, (c) => c.toUpperCase());
}

const DEFAULT_SUGGESTIONS = {
  produce: ["Bananas", "Apples", "Avocado", "Strawberries", "Raspberries", "Blueberries"],
  veg: ["Carrots", "Onions", "Tomatoes", "Potatoes", "Spinach", "Fresh beans"],
  fish: ["Salmon fillets", "Tinned tuna"],
  chicken: ["Chicken breast", "Chicken thigh fillets"],
  meat: ["Beef mince", "Chilli con carne mix"],
  pantry: ["Pasta", "Rice", "Olive oil", "Jar curry paste", "Heinz mayonnaise seriously good", "Worcester sauce", "Muesli", "Baked beans", "Tin black beans", "Tin red kidney beans", "Arnotts shortbread creams", "Chocolate digestives"],
  dairy: ["Full cream milk 2L", "Tasty cheese", "Greek yoghurt", "Yoghurts"],
  bakery: ["Sourdough loaf", "Wraps", "Bread"],
  frozen: ["Frozen peas", "Ice cream", "Greens for freezer", "Frozen broccoli", "Frozen cauliflower"],
  drinks: ["Sparkling water", "Orange juice"],
  household: ["Toilet paper", "Dish soap", "Steradent"],
};

let uid = 0;
const nextId = () => `item-${Date.now()}-${uid++}`;
const STORAGE_KEY = "shopping-app-category-history";
const ITEMS_STORAGE_KEY = "shopping-app-current-list";

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}
function persistHistory(next) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
  } catch (e) {}
}
function loadItems() {
  try {
    const raw = localStorage.getItem(ITEMS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function persistItems(next) {
  try {
    localStorage.setItem(ITEMS_STORAGE_KEY, JSON.stringify(next));
  } catch (e) {}
}

const SHARE_ID_KEY = "shopping-app-share-id";
const KVDB_BASE = "https://kvdb.io";
const KVDB_KEY = "list";

function ShoppingListApp() {
  const [items, setItems] = useState(() => loadItems());
  const [draft, setDraft] = useState("");
  const [activeTab, setActiveTab] = useState(null);
  const [history, setHistory] = useState(() => loadHistory());
  const [removing, setRemoving] = useState({});
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const [shareId, setShareId] = useState(() => localStorage.getItem(SHARE_ID_KEY) || null);
  const [showSync, setShowSync] = useState(false);
  const [shareInput, setShareInput] = useState("");
  const [syncing, setSyncing] = useState(false);
  const skipPushRef = useRef(false);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  };

  const applyRemoteItems = (remoteItems) => {
    skipPushRef.current = true;
    setItems(remoteItems || []);
  };

  const fetchRemote = async (bucket) => {
    try {
      const res = await fetch(`${KVDB_BASE}/${bucket}/${KVDB_KEY}`);
      if (!res.ok) throw new Error("not found");
      const text = await res.text();
      const data = text ? JSON.parse(text) : { items: [] };
      applyRemoteItems(data.items || []);
    } catch (e) {
      console.error("sync fetch failed", e);
      // silent — keep whatever is currently shown, try again on next poll
    }
  };

  const pushRemote = async (bucket, currentItems) => {
    try {
      await fetch(`${KVDB_BASE}/${bucket}/${KVDB_KEY}`, {
        method: "PUT",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ items: currentItems }),
      });
    } catch (e) {
      console.error("sync push failed", e);
    }
  };

  // initial load: if this device already has a shared list, pull it
  useEffect(() => {
    if (shareId) fetchRemote(shareId);
  }, []);

  // poll the shared list every few seconds so both devices stay in step
  useEffect(() => {
    if (!shareId) return;
    const t = setInterval(() => fetchRemote(shareId), 6000);
    return () => clearInterval(t);
  }, [shareId]);

  useEffect(() => {
    if (skipPushRef.current) {
      skipPushRef.current = false;
      return;
    }
    if (shareId) {
      pushRemote(shareId, items);
    } else {
      persistItems(items);
    }
  }, [items]);

  const createShare = async () => {
    setSyncing(true);
    try {
      const res = await fetch(`${KVDB_BASE}/`, { method: "POST" });
      if (!res.ok) throw new Error(`bucket create failed: ${res.status}`);
      const bucket = (await res.text()).trim();
      if (!bucket) throw new Error("no bucket id returned");
      await pushRemote(bucket, items);
      localStorage.setItem(SHARE_ID_KEY, bucket);
      setShareId(bucket);
      showToast("Shared list created — enter the code on the other device");
    } catch (e) {
      console.error("createShare failed", e);
      showToast("Couldn't create a shared list — check your connection and try again");
    } finally {
      setSyncing(false);
    }
  };

  const joinShare = async () => {
    const id = shareInput.trim();
    if (!id) return;
    setSyncing(true);
    try {
      const res = await fetch(`${KVDB_BASE}/${id}/${KVDB_KEY}`);
      if (!res.ok && res.status !== 404) throw new Error(`join failed: ${res.status}`);
      const text = res.ok ? await res.text() : "";
      const data = text ? JSON.parse(text) : { items: [] };
      localStorage.setItem(SHARE_ID_KEY, id);
      setShareId(id);
      applyRemoteItems(data.items || []);
      showToast("Joined shared list");
    } catch (e) {
      console.error("joinShare failed", e);
      showToast("Couldn't find that code — check it and try again");
    } finally {
      setSyncing(false);
    }
  };

  const stopSync = () => {
    localStorage.removeItem(SHARE_ID_KEY);
    setShareId(null);
    persistItems(items);
    showToast("Stopped syncing — list now saved on this device only");
  };

  const saveHistory = (next) => {
    setHistory(next);
    persistHistory(next);
  };

  const bumpHistory = (tabId, name) => {
    const bucket = { ...(history[tabId] || {}) };
    bucket[name] = (bucket[name] || 0) + 1;
    saveHistory({ ...history, [tabId]: bucket });
  };

  const addItem = (name, aisleId, tabId) => {
    setItems((prev) => [...prev, { id: nextId(), name, aisleId, checked: false }]);
    if (tabId) bumpHistory(tabId, name);
  };

  const handleBuildList = () => {
    const lines = draft.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) return;
    const newItems = lines.map((line) => {
      const { aisleId, tabId } = classify(line);
      bumpHistory(tabId, titleCase(line));
      return { id: nextId(), name: titleCase(line), aisleId, checked: false };
    });
    setItems((prev) => [...prev, ...newItems]);
    setDraft("");
    setToast(`Added ${newItems.length} item${newItems.length > 1 ? "s" : ""}, sorted by aisle`);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  };

  const toggleItem = (id) => {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, checked: true } : it)));
    setRemoving((prev) => ({ ...prev, [id]: true }));
    setTimeout(() => {
      setItems((prev) => prev.filter((it) => it.id !== id));
      setRemoving((prev) => {
        const { [id]: _, ...rest } = prev;
        return rest;
      });
    }, 420);
  };

  const removeItem = (id) => setItems((prev) => prev.filter((it) => it.id !== id));

  const grouped = AISLES.map((aisle) => ({
    aisle,
    items: items.filter((it) => it.aisleId === aisle.id),
  })).filter((g) => g.items.length > 0);

  const remainingCount = items.length;

  const suggestionsFor = (tabId) => {
    const learned = history[tabId] || {};
    const learnedSorted = Object.entries(learned).sort((a, b) => b[1] - a[1]).map(([name]) => name);
    const defaults = DEFAULT_SUGGESTIONS[tabId] || [];
    const combined = [...learnedSorted];
    for (const d of defaults) if (!combined.includes(d)) combined.push(d);
    return combined.slice(0, 8);
  };

  return (
    <div style={styles.page}>
      <div style={styles.appShell}>
        <header style={styles.header}>
          <div style={styles.headerTop}>
            <div style={styles.logoMark}><ShoppingBasket size={20} color="#FAF8F3" /></div>
            <div>
              <h1 style={styles.title}>Carol's Shopping List</h1>
              <p style={styles.subtitle}>
                {remainingCount === 0 ? "Nothing left to grab" : `${remainingCount} item${remainingCount === 1 ? "" : "s"} left, aisle by aisle`}
              </p>
            </div>
          </div>
          <button style={styles.syncPill} onClick={() => setShowSync((v) => !v)}>
            {shareId ? "🔗 Synced across devices" : "📱 Not synced — tap to set up"}
          </button>
        </header>

        {showSync && (
          <section style={styles.syncPanel}>
            {shareId ? (
              <>
                <p style={styles.syncText}>
                  This list is synced. On the other device, open this same page and enter this code:
                </p>
                <div style={styles.syncCode}>{shareId}</div>
                <button style={styles.syncSecondaryBtn} onClick={stopSync}>Stop syncing</button>
              </>
            ) : (
              <>
                <p style={styles.syncText}>Set this up once, then both devices will see the same list.</p>
                <button style={styles.syncPrimaryBtn} onClick={createShare} disabled={syncing}>
                  {syncing ? "Setting up…" : "Create shared list (do this first, on one device)"}
                </button>
                <div style={styles.syncJoinRow}>
                  <input
                    style={styles.syncInput}
                    placeholder="Or enter a code from the other device"
                    value={shareInput}
                    onChange={(e) => setShareInput(e.target.value)}
                  />
                  <button style={styles.syncSecondaryBtn} onClick={joinShare} disabled={syncing || !shareInput.trim()}>
                    Join
                  </button>
                </div>
              </>
            )}
          </section>
        )}

        <section style={styles.composer}>
          <textarea
            style={styles.textarea}
            placeholder={"Type items, one per line — milk, bananas, pasta..."}
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            rows={1}
          />
          <button style={{ ...styles.buildBtn, opacity: draft.trim() ? 1 : 0.5 }} onClick={handleBuildList} disabled={!draft.trim()}>
            Sort onto list
          </button>
        </section>

        <section style={styles.tabsWrap}>
          <div style={styles.tabsScroll}>
            {CATEGORY_TABS.map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(activeTab === tab.id ? null : tab.id)}
                style={{ ...styles.tabChip, ...(activeTab === tab.id ? styles.tabChipActive : {}) }}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {activeTab && (
            <div style={styles.suggestPanel}>
              <div style={styles.suggestHeading}>
                {history[activeTab] && Object.keys(history[activeTab]).length > 0 ? "Your usual picks" : "Common picks"}
              </div>
              <div style={styles.suggestGrid}>
                {suggestionsFor(activeTab).map((name) => (
                  <button key={name} style={styles.suggestItem} onClick={() => {
                    const { aisleId } = classify(name);
                    addItem(name, aisleId, activeTab);
                  }}>
                    <Plus size={14} color="#2D5A3D" />
                    <span>{name}</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </section>

        <section style={styles.list}>
          {grouped.length === 0 && (
            <div style={styles.empty}>
              <p style={styles.emptyTitle}>Your trolley is empty</p>
              <p style={styles.emptyBody}>Type a list above, or tap a category to add your usual items.</p>
            </div>
          )}

          {grouped.map(({ aisle, items: aisleItems }) => (
            <div key={aisle.id} style={styles.aisleBlock}>
              <div style={styles.aisleHeading}>
                <span style={styles.aisleNum}>{aisle.num}</span>
                <span>{aisle.label}</span>
              </div>
              <div>
                {aisleItems.map((it) => (
                  <div key={it.id} style={{ ...styles.row, ...(removing[it.id] ? styles.rowRemoving : {}) }}>
                    <button style={styles.checkBtn} onClick={() => toggleItem(it.id)} aria-label={`Mark ${it.name} in trolley`}>
                      {it.checked && <Check size={14} color="#FAF8F3" />}
                    </button>
                    <span style={{ ...styles.rowLabel, ...(it.checked ? styles.rowLabelChecked : {}) }}>{it.name}</span>
                    <button style={styles.removeBtn} onClick={() => removeItem(it.id)} aria-label={`Remove ${it.name}`}>
                      <Trash2 size={14} color="#B7AF9E" />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </section>

        {remainingCount > 0 && (
          <section style={styles.copyCard}>
            <button style={styles.copyBtn} onClick={() => {
              const text = grouped.map((g) => g.items.map((it) => it.name).join("\n")).join("\n");
              navigator.clipboard?.writeText(text);
              setToast("List copied to clipboard");
              clearTimeout(toastTimer.current);
              toastTimer.current = setTimeout(() => setToast(null), 2200);
            }}>
              <Copy size={15} color="#2D5A3D" />
              Copy list
            </button>
          </section>
        )}
      </div>

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "#EFEBE1", display: "flex", justifyContent: "center", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", padding: "0 0 40px" },
  appShell: { width: "100%", maxWidth: 440, background: "#FAF8F3", minHeight: "100vh", boxShadow: "0 0 40px rgba(0,0,0,0.06)" },
  header: { background: "#2D5A3D", padding: "28px 20px 22px" },
  headerTop: { display: "flex", alignItems: "center", gap: 12 },
  logoMark: { width: 40, height: 40, borderRadius: 10, background: "#3E7350", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 },
  title: { margin: 0, fontSize: 22, fontWeight: 700, color: "#FAF8F3", letterSpacing: "-0.01em" },
  subtitle: { margin: "2px 0 0", fontSize: 13, color: "#C7DAC9" },
  syncPill: { marginTop: 14, background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 999, color: "#FAF8F3", fontSize: 12.5, padding: "6px 12px", cursor: "pointer" },
  syncPanel: { margin: "0 20px", marginTop: 14, padding: 16, background: "#F1EEE4", borderRadius: 12 },
  syncText: { margin: "0 0 10px", fontSize: 13, color: "#5C5647", lineHeight: 1.5 },
  syncCode: { fontSize: 20, fontWeight: 700, letterSpacing: "0.03em", color: "#2D5A3D", background: "#FFFFFF", border: "1px dashed #C9C2AC", borderRadius: 10, padding: "10px 14px", textAlign: "center", marginBottom: 10, wordBreak: "break-all" },
  syncPrimaryBtn: { width: "100%", background: "#2D5A3D", color: "#FAF8F3", border: "none", borderRadius: 10, padding: "11px 0", fontSize: 13.5, fontWeight: 600, cursor: "pointer" },
  syncJoinRow: { display: "flex", gap: 8, marginTop: 10 },
  syncInput: { flex: 1, border: "1px solid #DCD6C6", borderRadius: 10, padding: "10px 12px", fontSize: 13.5, fontFamily: "inherit" },
  syncSecondaryBtn: { background: "#FFFFFF", border: "1px solid #DCD6C6", borderRadius: 10, padding: "10px 16px", fontSize: 13.5, fontWeight: 600, color: "#2D5A3D", cursor: "pointer" },
  composer: { padding: "18px 20px 0" },
  textarea: { width: "100%", boxSizing: "border-box", border: "1px solid #E4DFD3", borderRadius: 12, padding: "12px 14px", fontSize: 14.5, color: "#1C2620", background: "#FFFFFF", resize: "vertical", fontFamily: "inherit", lineHeight: 1.5 },
  buildBtn: { marginTop: 10, width: "100%", background: "#B8451F", color: "#FAF8F3", border: "none", borderRadius: 12, padding: "12px 0", fontSize: 15, fontWeight: 600, cursor: "pointer" },
  tabsWrap: { padding: "18px 0 0" },
  tabsScroll: { display: "flex", flexWrap: "wrap", gap: 8, padding: "0 20px 4px" },
  tabChip: { padding: "8px 14px", borderRadius: 999, border: "1px solid #E4DFD3", background: "#FFFFFF", color: "#5C5647", fontSize: 13.5, fontWeight: 500, cursor: "pointer", whiteSpace: "nowrap" },
  tabChipActive: { background: "#2D5A3D", borderColor: "#2D5A3D", color: "#FAF8F3" },
  suggestPanel: { margin: "10px 20px 0", padding: "14px", background: "#F1EEE4", borderRadius: 12 },
  suggestHeading: { fontSize: 12.5, color: "#8A8578", marginBottom: 10, fontWeight: 500 },
  suggestGrid: { display: "flex", flexWrap: "wrap", gap: 8 },
  suggestItem: { display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 999, border: "1px solid #DCD6C6", background: "#FFFFFF", color: "#1C2620", fontSize: 13, cursor: "pointer" },
  list: { padding: "18px 20px 4px" },
  empty: { padding: "40px 10px", textAlign: "center" },
  emptyTitle: { margin: 0, fontSize: 15.5, fontWeight: 600, color: "#1C2620" },
  emptyBody: { margin: "6px 0 0", fontSize: 13.5, color: "#8A8578", lineHeight: 1.5 },
  aisleBlock: { marginBottom: 20 },
  aisleHeading: { display: "flex", alignItems: "center", gap: 8, fontSize: 18.75, fontWeight: 600, color: "#8A8578", marginBottom: 8 },
  aisleNum: { width: 27, height: 27, borderRadius: 7, background: "#E4DFD3", color: "#5C5647", fontSize: 16.5, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 },
  row: { display: "flex", alignItems: "center", gap: 12, padding: "10px 4px", borderBottom: "1px solid #F1EEE4", transition: "opacity 0.4s ease, transform 0.4s ease", opacity: 1 },
  rowRemoving: { opacity: 0, transform: "translateX(12px)" },
